name: Build and Distribute APK

on:
  push:
    branches:
      - feature/ci_cd

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Firebase service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/firebase-credentials.json"

      - name: Build APK and upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
        run: ./gradlew assembleRelease appDistributionUploadRelease --stacktrace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Drive API client
        run: pip install google-api-python-client google-auth

      - name: Upload APK to Google Drive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
          DRIVE_FOLDER_ID: 1juZQyXUbeE8DF2AQixSkW96sNOC11W6o
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: python scripts/upload-to-drive.py
