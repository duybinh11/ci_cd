name: Build and Distribute APK

on:
  push:
    branches:
      - feature/ci_cd

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Firebase service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/firebase-credentials.json"

      - name: Build APK and upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-credentials.json
          FIREBASE_TESTERS_EMAIL: ${{ secrets.FIREBASE_TESTERS_EMAIL }}
        run: ./gradlew assembleDebug appDistributionUploadDebug --stacktrace
